<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#14110e" />
    <title>도원 · 삼국지 전술 RPG</title>
    <style>
      /* Gowun Batang (SIL OFL, public/fonts/OFL.txt), cut down to the game's characters + 2,350 common Hangul */
      @font-face { font-family: "Gowun Batang"; font-weight: 400; font-display: block; src: url("./fonts/GowunBatang-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Gowun Batang"; font-weight: 700; font-display: block; src: url("./fonts/GowunBatang-Bold.woff2") format("woff2"); }
      html, body { margin: 0; height: 100%; background: #14110e; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      #game { width: 100%; height: 100%; }
      /* shown until the game's own loading screen takes over */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #a8977a; font: 14px "Gowun Batang", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; pointer-events: none; }
      #game canvas ~ #boot, body.ready #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="boot">도원 · 불러오는 중…</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
